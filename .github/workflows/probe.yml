name: Probe
on:
  workflow_dispatch:
jobs:
  test-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            ./build/build.sh 4.1.5 1
      - name: Install and try to start rspamd, with diagnostics
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -c '
              set -x
              dnf -y install ./out/RPMS/rspamd-4.1.5-1.amzn2023.x86_64.rpm
              rspamd -c /etc/rspamd/rspamd.conf -f -u root -g root &
              RPID=$!
              for i in $(seq 1 30); do
                (exec 3<>/dev/tcp/127.0.0.1/11333) 2>/dev/null && { echo "LISTENING after ${i}s"; break; }
                sleep 1
              done
              (exec 3<>/dev/tcp/127.0.0.1/11333) 2>/dev/null && echo "PORT_OPEN" || echo "PORT_STILL_CLOSED"
              ls -ld /run/rspamd 2>&1 || true
              ps aux | grep rspamd
              echo "=== log tail ==="
              tail -n 40 /var/log/rspamd/rspamd.log
              kill $RPID 2>/dev/null || true
            '
