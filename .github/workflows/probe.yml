name: Probe
on:
  workflow_dispatch:
jobs:
  probe3:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          docker run --rm public.ecr.aws/amazonlinux/amazonlinux:2023 bash -c '
            set -x
            dnf -y -q install cmake cmake-filesystem >/dev/null
            rpm -ql cmake-filesystem
            rpm -ql cmake | grep -iE "macro|rpm"
            echo "=== eval cmake macro ==="
            rpm --eval "%{?cmake}"
            echo "=== optflags ==="
            rpm --eval "%{optflags}"
            echo "=== presetdir ==="
            dnf -y -q install systemd-rpm-macros >/dev/null
            rpm --eval "%{_presetdir}"
          '
