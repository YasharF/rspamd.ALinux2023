name: Probe
on:
  workflow_dispatch:
jobs:
  test-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            ./build/build.sh 4.1.5 1
      - name: Install and try to start rspamd, with diagnostics
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -c '
              set -x
              dnf -y install ./out/RPMS/rspamd-4.1.5-1.amzn2023.x86_64.rpm
              rpm --eval "rundir=%{_localstatedir}/run/rspamd"
              ls -ld /var/run /run /var/run/rspamd /run/rspamd 2>&1 || true
              timeout 5 rspamd -c /etc/rspamd/rspamd.conf -f -u root -g root || echo "EXIT=$?"
              echo "=== log ==="
              cat /var/log/rspamd/rspamd.log 2>&1 || true
            '
