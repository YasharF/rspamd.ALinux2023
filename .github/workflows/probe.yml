name: Probe
on:
  workflow_dispatch:
jobs:
  test-verify-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            ./build/build.sh 4.1.5 1
      - name: Install the RPMs and start rspamd
        run: |
          docker run -d --name rspamd --network host \
            -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            ./verify/run.sh /w/out/RPMS
          for port in 11332 11333 11334; do
            for i in $(seq 1 60); do
              (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && break
              if [ "$i" = 60 ]; then
                docker logs rspamd
                echo "rspamd never listened on $port"
                exit 1
              fi
              sleep 2
            done
          done
          docker logs rspamd

      - name: Controller liveness (/ping)
        run: |
          resp=$(curl -fsS http://127.0.0.1:11334/ping | tr -d '\r')
          echo "$resp"
          [ "$resp" = "pong" ] || { echo "controller /ping did not answer pong"; exit 1; }

      - name: Normal worker scan (local rule, no network)
        run: |
          out=$(docker exec -i rspamd rspamc -h 127.0.0.1:11333 symbols < verify/no-date.eml)
          echo "$out"
          echo "$out" | grep -q MISSING_DATE \
            || { echo "scan ran but MISSING_DATE did not fire"; exit 1; }

      - name: Milter mode handshake (rspamd_proxy)
        run: python3 verify/milter-optneg.py

      - name: rspamadm configtest
        run: docker exec rspamd rspamadm configtest -c /etc/rspamd/rspamd.conf

      - name: rspamd log
        if: always()
        run: docker logs rspamd
