name: Probe
# Scratch workflow used only while developing build.sh, to check what package
# names AL2023's repos actually carry. Deleted once the build works.

on:
  workflow_dispatch:

jobs:
  probe2:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          docker run --rm public.ecr.aws/amazonlinux/amazonlinux:2023 bash -c '
            set -x
            dnf -y -q install "dnf-command(repoquery)" >/dev/null
            for pkg in systemd-rpm-macros redhat-rpm-config cmake-filesystem findutils \
                       diffutils which curl-minimal; do
              echo "=== $pkg ==="
              dnf -q repoquery --qf "%{name}-%{version}-%{release}.%{arch}" "$pkg" 2>&1 | head -3
            done
            echo "=== cmake macro file ==="
            dnf -y -q install cmake >/dev/null
            rpm -ql cmake | grep -i macro
            echo "=== gcc version / cxx20 test ==="
            dnf -y -q install gcc-c++ >/dev/null
            g++ --version | head -1
            echo "int main(){ auto x = 1; return 0; }" > /tmp/t.cc
            g++ -std=c++20 -c /tmp/t.cc -o /tmp/t.o && echo "c++20 OK"
          '
