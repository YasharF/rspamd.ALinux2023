name: Probe
on:
  workflow_dispatch:
jobs:
  test-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            ./build/build.sh 4.1.5 1
      - name: Install and start rspamd the way verify/run.sh does
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -c '
              set -x
              dnf -y install ./out/RPMS/rspamd-4.1.5-1.amzn2023.x86_64.rpm
              rspamd -c /etc/rspamd/rspamd.conf -f &
              RPID=$!
              for port in 11332 11333 11334; do
                ok=0
                for i in $(seq 1 15); do
                  (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null && { ok=1; echo "port $port open after ${i}s"; break; }
                  sleep 1
                done
                [ "$ok" = 1 ] || echo "port $port NEVER opened"
              done
              echo "=== full log ==="
              cat /var/log/rspamd/rspamd.log
              kill $RPID 2>/dev/null || true
            '
